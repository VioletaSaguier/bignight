<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Foto · En arco</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{root}}">
<div style="padding: 44px 30px 120px; display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center">
<div style="font-size: 13px; letter-spacing: 0.3em">JUNTO A SUS FAMILIAS</div>
<div style="{{arch}}">
<svg width="260" height="340" viewBox="0 0 260 340" aria-hidden="true" style="{{filter}}"><rect width="260" height="340" fill="#B9C2B0"/><circle cx="104" cy="120" r="34" fill="#8C7E70"/><circle cx="158" cy="132" r="31" fill="#A08F80"/><path d="M40 340 C40 210 70 168 104 168 C140 168 152 240 152 340 Z" fill="#5E5650"/><path d="M120 340 C120 220 136 180 162 180 C196 180 222 250 222 340 Z" fill="#D8CFC2"/></svg>
</div>
<div style="font-size: 12px; font-style: italic; margin-top: -14px">su foto, en blanco y negro</div>
<h1 style="margin: 0; font-weight: 400; font-size: 46px; line-height: 1"><span style="font-style: italic">Ana</span> &amp; <span style="font-style: italic">Nico</span></h1>
<div style="font-size: 18px">29 · 06 · 27<br><span style="font-style: italic">Villa [NOMBRE], Toscana</span></div>
<div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="#" style="{{ghost}}">Confirmar</a>
<a href="Regalos.dc.html" style="{{solid}}">Regalos</a>
</div>
<section style="width: 100%; display: flex; flex-direction: column; gap: 4px; text-align: left">

<a href="Regalos.dc.html" style="{{row}}"><span>Aperitivo en Florencia</span><span>$ 95.000</span></a>

</section>
</div>
<div style="{{bar}}">
<a href="#" style="{{ghost}}">Confirmar</a>
<a href="Regalos.dc.html" style="{{solid}}">Regalos</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","default":"Tinta","options":["Tinta","Oliva","Terracota","Azul toscano","Ciruela"]},"filtro":{"editor":"enum","default":"Blanco y negro","options":["Blanco y negro","Color","Sepia"]},"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const P = { 'Tinta': ['#F7F4EC', '#2A2A26'], 'Oliva': ['#F2F0E4', '#4A5A33'], 'Terracota': ['#F8EEE4', '#9C4528'], 'Azul toscano': ['#F1F3F2', '#2B4A8C'], 'Ciruela': ['#F5EEF0', '#6B2E4A'] };
    const [bg, ink] = P[this.props.palette] || P['Tinta'];
    const f = { 'Blanco y negro': 'grayscale(1)', 'Color': 'none', 'Sepia': 'sepia(0.7)' }[this.props.filtro] || 'grayscale(1)';
    const b = 'text-align: center; font-family: inherit; font-size: 17px; padding: 14px 6px; text-decoration: none; ';
    return {
      root: 'width: 390px; height: 1400px; box-sizing: border-box; background: ' + bg + '; color: ' + ink + '; font-family: \'EB Garamond\', serif; position: relative; overflow: hidden',
      arch: 'width: 260px; height: 340px; border-radius: 130px 130px 0 0; overflow: hidden; outline: 1px solid ' + ink + '; outline-offset: 8px',
      filter: 'display: block; filter: ' + f,
      ghost: b + 'border: 1px solid ' + ink + '; color: ' + ink + ';',
      solid: b + 'background: ' + ink + '; color: ' + bg + ';',
      row: 'display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px dotted ' + ink + '; font-size: 17px; text-decoration: none; color: ' + ink,
      link: 'font-style: italic; padding: 10px 0; color: ' + ink,
      bar: 'position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: ' + bg + '; border-top: 1px solid ' + ink + '; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px'
    };
  }
}
</script>
</body>
</html>
