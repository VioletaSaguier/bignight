class Component extends DCLogic {
  renderVals() {

    const f = { 'Blanco y negro': 'grayscale(1)', 'Color': 'none', 'Sepia': 'sepia(0.7)' }[this.props.filtro] || 'grayscale(1)';

      filter: 'display: block; filter: ' + f,
      ghost: b + 'border: 1px solid ' + ink + '; color: ' + ink + ';',
      solid: b + 'background: ' + ink + '; color: ' + bg + ';',
      row: 'display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid ' + ink + '33; font-size: 18px; text-decoration: none; color: ' + ink,
      link: 'padding: 10px 0; color: ' + ink,

    };
  }
}
