<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Groovy retro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8202F}a:hover{color:#951521}
.checker{background-image:repeating-conic-gradient(#C8202F 0 25%, #FFF4E2 0 50%);background-size:36px 36px}
</style>
</helmet>
<div style="width: 390px; min-height: 1200px; box-sizing: border-box; background: #FFF4E2; color: #2A1414; font-family: 'Outfit', sans-serif; display: flex; flex-direction: column">
<div class="checker" style="height: 54px"></div>
<div style="background: {{accent}}; color: #FFF4E2; padding: 40px 24px 56px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<div style="font-weight: 600; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase">Vení a bailar con</div>
<h1 style="margin: 0; font-family: 'Shrikhand', serif; font-weight: 400; font-size: 72px; line-height: 0.95; transform: rotate(-4deg)">Sol<br>&amp; Tincho</h1>
<div style="background: #FFF4E2; color: {{accent}}; font-weight: 600; font-size: 17px; padding: 10px 18px; border-radius: 999px">Sábado 9 de octubre</div>
</div>
<svg viewBox="0 0 390 24" width="390" height="24" aria-hidden="true" style="display: block; margin-top: -1px"><path d="M0 0 H390 V6 Q373 24 357 6 Q341 -12 325 6 Q309 24 293 6 Q277 -12 260 6 Q244 24 228 6 Q212 -12 195 6 Q179 24 163 6 Q147 -12 130 6 Q114 24 98 6 Q82 -12 65 6 Q49 24 33 6 Q17 -12 0 6 Z" fill="{{accent}}"/></svg>
<div style="padding: 32px 24px 40px; display: flex; flex-direction: column; gap: 28px">
<div style="height: 220px; border-radius: 110px 110px 24px 24px; background: #F2D9C2; border: 4px solid #2A1414; display: flex; align-items: center; justify-content: center; font-size: 13px">Foto de los dos</div>
<section style="display: flex; flex-direction: column; gap: 10px; text-align: center">
<h2 style="margin: 0; font-family: 'Shrikhand', serif; font-weight: 400; font-size: 34px; color: {{accent}}">¿Dónde?</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.5">Club [NOMBRE], Tigre<br>Llegá 19 h, se baila hasta tarde</p>
</section>
<section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center">
<div style="border: 3px solid #2A1414; border-radius: 16px; padding: 12px 4px"><div style="font-family: 'Shrikhand', serif; font-size: 22px">19 h</div><div style="font-size: 13px">Sí, juro</div></div>
<div style="border: 3px solid #2A1414; border-radius: 16px; padding: 12px 4px"><div style="font-family: 'Shrikhand', serif; font-size: 22px">20 h</div><div style="font-size: 13px">Choripán</div></div>
<div style="border: 3px solid #2A1414; border-radius: 16px; padding: 12px 4px"><div style="font-family: 'Shrikhand', serif; font-size: 22px">22 h</div><div style="font-size: 13px">Pista</div></div>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; text-align: center; font-family: 'Shrikhand', serif; font-weight: 400; font-size: 34px; color: {{accent}}">¿Venís?</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="font: inherit; font-weight: 600; font-size: 17px; padding: 16px; border: 3px solid #2A1414; border-radius: 999px; background: {{accent}}; color: #FFF4E2">¡Voy!</button>
<button type="button" style="font: inherit; font-weight: 600; font-size: 17px; padding: 16px; border: 3px solid #2A1414; border-radius: 999px; background: #FFF4E2; color: #2A1414">No puedo</button>
</div>
</section>
<a href="Regalos.dc.html" style="text-align: center; font-weight: 600; font-size: 17px; padding: 16px; background: #2A1414; color: #FFF4E2; border-radius: 999px; text-decoration: none">Ver regalos</a>
</div>
<div class="checker" style="height: 54px; margin-top: auto"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8202F","options":["#C8202F","#E07A1F","#2F6B4F"]},"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C8202F' };
  }
}
</script>
</body>
</html>
